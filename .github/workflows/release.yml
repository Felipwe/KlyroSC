name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, lint, tests, build)
        run: npm run verify

      - name: Publish release artifacts
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload themed installer (Windows)
        if: runner.os == 'Windows'
        run: |
          node scripts/make-setup.mjs
          gh release upload ${{ github.ref_name }} (Get-ChildItem dist/KlyroSC-Setup-*.exe).FullName --clobber
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
